name: learn-github-actions
run-name: ${{ github.actor }} is deploying web
on: [push]
jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - name: install deps
        run: npm install
      - name: build dist
        run: npm run build
      - name: move dist files to the server nginx
        uses: zhenyuWang/Upload-File-Action@v1.0.1
        with:
          username: ${{ secrets.REMOTE_USER }}
          server: ${{ secrets.REMOTE_HOST }}
          port: "22"
          ssh_private_key: ${{ secrets.PRIVATE_KEY}}
            # 要上传文件所在目录
          local_path: "dist/*"
            # 远程服务器目标路径
          target_path: "/usr/local/nginx/html/"
